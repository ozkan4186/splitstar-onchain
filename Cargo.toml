[workspace]
resolver = "2"
members = ["contracts/*"]
# Derlenen wasm'ın kopyalandığı klasör; crate değil, workspace üyesi sayılmasın.
exclude = ["contracts/out"]

[workspace.dependencies]
soroban-sdk = "27.0.2"

# Wasm boyutunu küçültmek için önerilen release ayarları
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
